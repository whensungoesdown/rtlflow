<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>rtlflow</title>
<style>
html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; color: #222; }
body { display: flex; flex-direction: column; }
#hdr { padding: 8px 14px 6px; background: #fff; border-bottom: 1px solid #ccc; }
#hdr h1 { font-size: 22px; margin: 0; }
#hdr .sub { color: #666; font-size: 13px; margin-top: 3px; }
#bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 14px;
       background: #f7f7f7; border-bottom: 1px solid #ccc; }
button, select { font-size: 14px; padding: 4px 10px; cursor: pointer; }
.sep { width: 1px; height: 24px; background: #ccc; margin: 0 4px; }
#pos { font-weight: bold; min-width: 130px; }
#steps span { padding: 3px 8px; border: 1px solid #bbb; border-radius: 3px; margin-right: 3px; cursor: pointer;
              font-size: 13px; background: #fff; }
#steps span.on { background: #222; color: #fff; border-color: #222; }
#slider { flex: 1; min-width: 120px; }
#main { flex: 1; display: flex; min-height: 0; }
#view { flex: 1; overflow: auto; background: #fff; }
#side { width: 330px; border-left: 1px solid #ccc; overflow: auto; padding: 10px 14px; font-size: 14px;
        background: #fcfcfc; line-height: 1.45; }
#side h3 { font-size: 15px; margin: 4px 0 6px; }
#side .muted { color: #777; }
#side code, #side .mono { font-family: Consolas, monospace; font-size: 13px; }
#side a { color: #2456c8; cursor: pointer; text-decoration: none; }
#side a:hover { text-decoration: underline; }
#side hr { border: 0; border-top: 1px solid #ddd; margin: 12px 0; }
#notes li, #info li { margin-bottom: 2px; }
#notes ul, #info ul { margin: 4px 0; padding-left: 18px; }
svg text { pointer-events: none; }
.node { cursor: grab; }
.node.drag { cursor: grabbing; opacity: 0.8; }
#err { color: #b00; white-space: pre-wrap; font-family: Consolas, monospace; }
</style></head>
<body>
<div id="hdr"><h1 id="title"></h1><div class="sub" id="sub"></div></div>
<div id="bar">
  <button id="first" title="Home">&#x23EE;</button>
  <button id="pcyc" title="Up / PageUp">&laquo; cycle</button>
  <button id="prev" title="Left">&lsaquo; Prev</button>
  <button id="play" title="Space">Play</button>
  <button id="next" title="Right">Next &rsaquo;</button>
  <button id="ncyc" title="Down / PageDown">cycle &raquo;</button>
  <span id="pos"></span><span id="steps"></span>
  <input id="slider" type="range" min="0" value="0">
  <span class="sep"></span>
  <button id="zout" title="zoom out">&minus;</button><button id="zfit" title="fit the width">Fit</button><button id="zin" title="zoom in">+</button>
  <span class="sep"></span>
  <select id="lit" title="which wires are drawn as active">
    <option value="nz">lit: non-zero</option><option value="bit">lit: 1-bit non-zero</option>
    <option value="chg">lit: changed</option></select>
  <select id="hid"></select>
  <button id="auto" title="arrange all blocks again">Auto layout</button>
  <button id="save" title="download the layout, use it with --layout">Save layout</button>
  <button id="load" title="load a saved layout">Load layout</button>
  <input id="file" type="file" accept=".json" style="display:none">
</div>
<div id="main">
  <div id="view"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="side"><div id="err"></div><div id="notes"></div><hr><div id="info"></div><hr>
    <div class="muted" style="font-size:13px">
      Click a block for its details. Drag a block to move it (also to another row);
      the layout is kept in this browser, <b>Save layout</b> writes it to a file.<br>
      Keys: &larr;/&rarr; step, &uarr;/&darr; cycle, Space play, Home/End.
    </div></div>
</div>
<script>
'use strict';
const D = /*RTLFLOW_DATA*/null;
window.onerror = (m, s, l) => { document.getElementById('err').textContent += 'error: ' + m + ' (line ' + l + ')\n'; };

// ------------------------------------------------------------------ style
const LABEL_W = 130, MARGIN = 24, GAP = 52, PAD = 8, GSEP = 8, LANE = 10, PADB = 14, MINB = 34, MAXW = 2200;
const HGT = { input: 44, comb: 44, output: 44, reg: 72 };
const BANDS = { Inputs: '#fff6dd', Registers: '#e9f1fb', Logic: '#e1f6ea', Outputs: '#eee6f8' };
const BAND_OF = { input: 'Inputs', reg: 'Registers', comb: 'Logic', output: 'Outputs' };
const COL = { input: ['#ffe6cc', '#d79b00'], reg: ['#f8cecc', '#b85450'], comb: ['#d5e8d4', '#82b366'],
              output: ['#e1d5e7', '#9673a6'] };
const IDLE = ['#f5f5f5', '#b3b3b3'], FLOW = '#9a9aff', BACK = '#3cb4a4', WIRE = '#b5b5b5', CLKC = '#ff9900';
const INK = '#222', OFF = '#9a9a9a';
const F_LBL = '14px Arial', F_VAL = '12px Consolas, monospace';
const STEP_NAMES = ['clock edge', 'signals', 'next state'];

const NC = D.cycles.length;
const NODE = {};
D.nodes.forEach((n, k) => { NODE[n.id] = n; n.ord = k; });

// ------------------------------------------------------------------ values
function val(id, c) { const v = D.values[id]; return v && c >= 0 && c < NC ? v[c] : null; }
function active(h) { return h != null && /[1-9a-f]/.test(h); }
let LIT = 'nz';
function lit(id, c) {           // is the signal drawn as active in cycle c
  const h = val(id, c);
  if (LIT === 'chg') return h != null && c > 0 && h !== val(id, c - 1);
  if (LIT === 'bit' && NODE[id].width > 1) return false;
  return active(h);
}
function fmt(h, w) {
  if (h == null) return NC ? '?' : '';
  if (w === 1) return h;
  if (w <= 8) {
    let b = '';
    for (const ch of h) b += /[xz]/.test(ch) ? ch.repeat(4) : parseInt(ch, 16).toString(2).padStart(4, '0');
    return b.slice(-w);
  }
  if (h.length > 16) return h.slice(0, 6) + '…' + h.slice(-8);
  if (h.length > 8) return h.slice(0, h.length - 8) + '_' + h.slice(-8);
  return h;
}
function full(h, w) {
  if (h == null) return 'no value';
  return w === 1 ? h : w + "'h" + h.replace(/\B(?=(.{8})+$)/g, '_');
}
const cv = document.createElement('canvas').getContext('2d');
function tw(s, f) { cv.font = f; return cv.measureText(s).width; }
const NW = {};
D.nodes.forEach(n => {
  let len = fmt('0'.repeat(Math.ceil(n.width / 4)), n.width).length;
  (D.values[n.id] || []).forEach(h => { len = Math.max(len, fmt(h, n.width).length); });
  const w = Math.max(tw(n.id, F_LBL), len * tw('0', F_VAL));
  NW[n.id] = Math.round(Math.min(260, Math.max(80, w + 26)));
});

// ------------------------------------------------------------------ graph
let hidden = new Set(D.hidden), G, L, GEO;

function buildGraph() {
  function effIn(id, stack, out) {          // fanin through hidden blocks
    for (const f of NODE[id].fanin) {
      if (!hidden.has(f)) out.add(f);
      else if (NODE[f].kind !== 'input' && !stack.has(f)) { stack.add(f); effIn(f, stack, out); stack.delete(f); }
    }
    return out;
  }
  const nodes = D.nodes.filter(n => !hidden.has(n.id));
  const edges = [], fin = {}, fout = {};
  nodes.forEach(n => { fin[n.id] = []; fout[n.id] = []; });
  for (const n of nodes) {
    for (const f of effIn(n.id, new Set([n.id]), new Set())) {
      if (f === n.id) continue;
      edges.push({ s: f, d: n.id, back: n.kind === 'reg' });
      fin[n.id].push(f); fout[f].push(n.id);
    }
  }
  G = { nodes, edges, fin, fout };
}

// ------------------------------------------------------------------ layout
function pav(ids, d) {
  // keep the order, keep GAP between blocks, stay as close as possible to the desired x
  const o = [0];
  for (let i = 1; i < ids.length; i++) o.push(o[i - 1] + (NW[ids[i - 1]] + NW[ids[i]]) / 2 + GAP);
  const bl = [];
  ids.forEach((id, i) => {
    bl.push({ s: d[i] - o[i], n: 1 });
    while (bl.length > 1 && bl[bl.length - 2].s / bl[bl.length - 2].n > bl[bl.length - 1].s / bl[bl.length - 1].n) {
      const b = bl.pop(); bl[bl.length - 1].s += b.s; bl[bl.length - 1].n += b.n;
    }
  });
  let i = 0;
  for (const b of bl) for (let k = 0; k < b.n; k++, i++) L.pos[ids[i]].x = b.s / b.n + o[i];
}

function rowIdsOf(r, all) {
  return Object.keys(L.pos).filter(id => L.pos[id].row === r && (all || !hidden.has(id)))
    .sort((a, b) => L.pos[a].x - L.pos[b].x);
}

function normalize() {
  const vis = G.nodes.map(n => n.id);
  if (!vis.length) return;
  const m = Math.min(...vis.map(id => L.pos[id].x - NW[id] / 2));
  for (const id in L.pos) L.pos[id].x += MARGIN - m;
}

function autoLayout() {
  const { nodes, fin, fout } = G;
  const lvl = {};
  function cl(id, st) {
    if (id in lvl) return lvl[id];
    if (st.has(id)) return 0;
    st.add(id);
    let l = 0;
    for (const f of fin[id]) if (NODE[f].kind === 'comb') l = Math.max(l, cl(f, st) + 1);
    st.delete(id);
    return (lvl[id] = l);
  }
  const by = k => nodes.filter(n => n.kind === k).map(n => n.id);
  const groups = [];
  const ins = by('input'), regs = by('reg'), combs = by('comb'), outs = by('output');
  if (ins.length) groups.push({ band: 'Inputs', ids: ins });
  if (regs.length) groups.push({ band: 'Registers', ids: regs });
  if (combs.length) {
    combs.forEach(id => cl(id, new Set()));
    const mx = Math.max(...combs.map(id => lvl[id]));
    for (let l = 0; l <= mx; l++) {
      const ids = combs.filter(id => lvl[id] === l);
      if (ids.length) groups.push({ band: 'Logic', ids });
    }
  }
  if (outs.length) groups.push({ band: 'Outputs', ids: outs });

  // order inside the groups: barycentre of the neighbours, a few sweeps
  const gi = {}, p = {};
  const setp = g => g.ids.forEach((id, j) => { p[id] = g.ids.length > 1 ? j / (g.ids.length - 1) : 0.5; });
  groups.forEach((g, k) => { g.ids.forEach(id => { gi[id] = k; }); setp(g); });
  for (let it = 0; it < 16; it++) {
    const order = [...groups.keys()];
    if (it % 2) order.reverse();
    for (const k of order) {
      const g = groups[k], key = {};
      for (const id of g.ids) {
        const nb = fin[id].concat(fout[id]).filter(x => gi[x] !== k);
        key[id] = nb.length ? nb.reduce((a, x) => a + p[x], 0) / nb.length : p[id];
      }
      g.ids.sort((a, b) => key[a] - key[b] || p[a] - p[b]);
      setp(g);
    }
  }

  // rows: a group wider than MAXW is dealt out over several rows
  L = { rows: [], pos: {} };
  const rows = [];
  for (const g of groups) {
    const tot = g.ids.reduce((a, id) => a + NW[id] + GAP, 0);
    const k = Math.max(1, Math.ceil(tot / MAXW));
    for (let j = 0; j < k; j++) {
      rows.push(g.ids.filter((_, i) => i % k === j));
      L.rows.push(g.band);
    }
  }
  const wmax = Math.max(...rows.map(ids => ids.reduce((a, id) => a + NW[id] + GAP, 0)));
  rows.forEach((ids, r) => {
    let x = (wmax - ids.reduce((a, id) => a + NW[id] + GAP, 0)) / 2;
    ids.forEach(id => { L.pos[id] = { row: r, x: x + NW[id] / 2 }; x += NW[id] + GAP; });
  });
  for (let it = 0; it < 12; it++) {
    rows.forEach((ids, r) => {
      const d = ids.map(id => {
        const nb = fin[id].concat(fout[id]).filter(x => L.pos[x].row !== r);
        return nb.length ? nb.reduce((a, x) => a + L.pos[x].x, 0) / nb.length : L.pos[id].x;
      });
      pav(ids, d);
    });
  }
  normalize();
}

function resolveRow(r) {
  const ids = rowIdsOf(r);
  pav(ids, ids.map(id => L.pos[id].x));
}

function place(id) {
  // a block shown again, or missing from a loaded layout
  const n = NODE[id];
  const cand = L.rows.map((b, r) => (b === BAND_OF[n.kind] ? r : -1)).filter(r => r >= 0);
  if (!cand.length) return false;
  let row = cand[0];
  if (n.kind === 'comb') {
    const fr = G.fin[id].filter(x => L.pos[x]).map(x => L.pos[x].row);
    const want = fr.length ? Math.max(...fr) + 1 : cand[0];
    row = cand.reduce((a, r) => (Math.abs(r - want) < Math.abs(a - want) ? r : a));
  } else if (n.kind === 'output') row = cand[cand.length - 1];
  const nb = G.fin[id].concat(G.fout[id]).filter(x => L.pos[x]);
  const x = nb.length ? nb.reduce((a, q) => a + L.pos[q].x, 0) / nb.length : MARGIN + NW[id] / 2;
  L.pos[id] = { row, x };
  resolveRow(row);
  return true;
}

// ------------------------------------------------------------------ routing
function route() {
  const R = L.rows.length;
  const rowIds = [];
  for (let r = 0; r < R; r++) rowIds.push(rowIdsOf(r));
  const box = {};
  for (const n of G.nodes) {
    const p = L.pos[n.id], w = NW[n.id];
    box[n.id] = { x: p.x, x0: p.x - w / 2, x1: p.x + w / 2, row: p.row, w, h: HGT[n.kind] };
  }
  const inc = {};
  G.edges.forEach(e => { (inc[e.d] = inc[e.d] || []).push(e); });
  function ports(ax) {
    for (const d in inc) {
      const b = box[d], es = inc[d].sort((a, c) => ax(a) - ax(c));
      es.forEach((e, k) => { e.px = b.x0 + b.w * (k + 1) / (es.length + 1); });
    }
  }
  ports(e => box[e.s].x);

  // one group per (source, destination row boundary); a group not in the
  // source's boundary gets a vertical gutter
  const vert = [];
  for (const n of G.nodes) if (G.fout[n.id].length) {
    const b = box[n.id].row + 1;
    vert.push({ x: box[n.id].x, b0: b, b1: b });
  }
  G.edges.forEach(e => vert.push({ x: e.px, b0: box[e.d].row, b1: box[e.d].row }));
  const groups = {};
  for (const e of G.edges) {
    const bs = box[e.s].row + 1, bd = box[e.d].row, k = e.s + '|' + bd;
    (groups[k] = groups[k] || { s: e.s, bs, bd, es: [] }).es.push(e);
    e.g = groups[k];
  }
  const blocked = (x, r0, r1) => {
    for (let r = r0; r <= r1; r++) for (const id of rowIds[r]) {
      const b = box[id];
      if (x >= b.x0 - PAD && x <= b.x1 + PAD) return true;
    }
    return false;
  };
  const used = (x, lo, hi) => vert.some(v => Math.abs(v.x - x) < GSEP && v.b0 <= hi && v.b1 >= lo);
  const gl = Object.values(groups).filter(g => g.bs !== g.bd)
    .sort((a, b) => Math.abs(a.bd - a.bs) - Math.abs(b.bd - b.bs));
  for (const g of gl) {
    const lo = Math.min(g.bs, g.bd), hi = Math.max(g.bs, g.bd);
    const target = Math.round(g.es.reduce((a, e) => a + e.px, 0) / g.es.length);
    let best = null;
    for (let dx = 0; best === null && dx < 6000; dx += 3) {
      for (const x of dx ? [target - dx, target + dx] : [target]) {
        if (x < 6 - LABEL_W / 2 || blocked(x, lo, hi - 1) || used(x, lo, hi)) continue;
        best = x; break;
      }
    }
    g.gx = best;
    vert.push({ x: best, b0: lo, b1: hi });
  }
  ports(e => (e.g.bs === e.g.bd ? box[e.s].x : e.g.gx));

  // horizontal segments: one per (source, boundary), packed into lanes
  const seg = {};
  function addSeg(s, b, xs) {
    const k = s + '|' + b;
    const q = (seg[k] = seg[k] || { s, b, lo: Infinity, hi: -Infinity });
    for (const x of xs) { q.lo = Math.min(q.lo, x); q.hi = Math.max(q.hi, x); }
  }
  for (const g of Object.values(groups)) {
    const sx = box[g.s].x, pxs = g.es.map(e => e.px);
    if (g.bs === g.bd) addSeg(g.s, g.bs, [sx, ...pxs]);
    else { addSeg(g.s, g.bs, [sx, g.gx]); addSeg(g.s, g.bd, [g.gx, ...pxs]); }
  }
  const lanes = Array(R + 1).fill(0), byB = {};
  Object.values(seg).forEach(q => { (byB[q.b] = byB[q.b] || []).push(q); });
  for (const b in byB) {
    const ends = [];
    byB[b].sort((p, q) => p.lo - q.lo).forEach(q => {
      let l = ends.findIndex(e => e + 8 < q.lo);
      if (l < 0) { l = ends.length; ends.push(0); }
      ends[l] = q.hi; q.lane = l;
    });
    lanes[b] = ends.length;
  }

  // rows and boundaries from the top
  const rowH = rowIds.map(ids => (ids.length ? Math.max(...ids.map(id => box[id].h)) : 12));
  const bTop = [], bH = [], rTop = [];
  let y = 0;
  for (let b = 0; b <= R; b++) {
    const edge = b === 0 || b === R;
    bTop[b] = y;
    bH[b] = Math.max(edge ? 20 : MINB, lanes[b] ? 2 * PADB + (lanes[b] - 1) * LANE : 0);
    y += bH[b];
    if (b < R) { rTop[b] = y; y += rowH[b]; }
  }
  const height = y;
  const laneY = (b, l) => bTop[b] + (bH[b] - (lanes[b] - 1) * LANE) / 2 + l * LANE;
  for (const id in box) {
    const b = box[id];
    b.y = rTop[b.row] + rowH[b.row] / 2; b.y0 = b.y - b.h / 2; b.y1 = b.y + b.h / 2;
  }
  let maxX = 0;
  for (const id in box) maxX = Math.max(maxX, box[id].x1);
  for (const g of gl) maxX = Math.max(maxX, g.gx);
  let minX = 0;
  for (const g of gl) minX = Math.min(minX, g.gx - 10);

  for (const e of G.edges) {
    const g = e.g, s = box[e.s], d = box[e.d];
    const q1 = seg[e.s + '|' + g.bs], ys = laneY(g.bs, q1.lane);
    const pts = [[s.x, s.y1], [s.x, ys]];
    e.dots = [];
    const dot = (q, x, yy) => { if (x > q.lo + 0.5 && x < q.hi - 0.5) e.dots.push([x, yy]); };
    if (g.bs === g.bd) { pts.push([e.px, ys]); dot(q1, e.px, ys); }
    else {
      const q2 = seg[e.s + '|' + g.bd], yd = laneY(g.bd, q2.lane);
      pts.push([g.gx, ys], [g.gx, yd], [e.px, yd]);
      dot(q1, g.gx, ys); dot(q2, e.px, yd);
    }
    pts.push([e.px, d.y0]);
    e.pts = pts.filter((p, i) => !i || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
  }

  // bands: runs of rows with the same band
  const bands = [];
  for (let r = 0; r < R; r++) {
    const top = r === 0 ? 0 : bTop[r] + bH[r] / 2;
    const bot = r === R - 1 ? height : bTop[r + 1] + bH[r + 1] / 2;
    if (bands.length && bands[bands.length - 1].name === L.rows[r]) bands[bands.length - 1].y1 = bot;
    else bands.push({ name: L.rows[r], y0: top, y1: bot });
  }
  GEO = { box, rTop, rowH, R, height, bands, ox: LABEL_W - minX, width: LABEL_W - minX + maxX + MARGIN };
}

// ------------------------------------------------------------------ drawing
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
function el(tag, at, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in at) e.setAttribute(k, at[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function shade(c, k = 0.9) {
  return '#' + [1, 3, 5].map(i => Math.round(parseInt(c.slice(i, i + 2), 16) * k).toString(16).padStart(2, '0')).join('');
}
const ptsAttr = (pts, ox) => pts.map(p => (p[0] + ox) + ',' + p[1]).join(' ');
let zoom = 1, ui = {}, sel = null;

function render() {
  const { box, height, width, ox } = GEO;
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  setZoom(zoom);
  const defs = el('defs', {}, svg);
  for (const [id, c, s] of [['aw', WIRE, 7], ['af', FLOW, 4], ['ab', BACK, 4], ['as', '#333', 6]]) {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: s, markerHeight: s,
                             orient: 'auto', markerUnits: id === 'aw' || id === 'as' ? 'userSpaceOnUse' : 'strokeWidth' }, defs);
    el('path', { d: 'M0,0 L10,5 L0,10 z', fill: c }, m);
  }
  const cp = el('clipPath', { id: 'front' }, defs);
  ui.front = el('rect', { x: 0, y: 0, width, height }, cp);

  for (const b of GEO.bands) {
    el('rect', { x: 0, y: b.y0, width, height: b.y1 - b.y0, fill: BANDS[b.name] }, svg);
    el('rect', { x: 0, y: b.y0, width: LABEL_W - 10, height: b.y1 - b.y0, fill: shade(BANDS[b.name]) }, svg);
    const t = el('text', { x: (LABEL_W - 10) / 2, y: (b.y0 + b.y1) / 2, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
                           'font-family': 'Arial', 'font-weight': 'bold', 'font-size': 22, fill: INK }, svg);
    t.textContent = b.name;
  }

  const base = el('g', { fill: 'none' }, svg);
  const flow = el('g', { fill: 'none', 'clip-path': 'url(#front)' }, svg);
  const back = el('g', { fill: 'none' }, svg);
  ui.edges = G.edges.map(e => {
    const w = NODE[e.s].width > 1 ? 1.8 : 1;
    const r = { e };
    r.base = el('polyline', { points: ptsAttr(e.pts, ox), stroke: WIRE, 'stroke-width': w, 'marker-end': 'url(#aw)' }, base);
    r.bdots = e.dots.map(([x, y]) => el('circle', { cx: x + ox, cy: y, r: 2.5, fill: WIRE }, base));
    const lay = e.back ? back : flow;
    r.w = NODE[e.s].width > 1 ? 2.5 : 4;
    r.hi = el('polyline', { points: ptsAttr(e.pts, ox), stroke: e.back ? BACK : FLOW, 'stroke-width': r.w,
                            'stroke-linejoin': 'miter', 'marker-end': e.back ? 'url(#ab)' : 'url(#af)', display: 'none' }, lay);
    r.hdots = e.dots.map(([x, y]) => el('circle', { cx: x + ox, cy: y, r: r.w + 1, fill: e.back ? BACK : FLOW, display: 'none' }, lay));
    return r;
  });

  const ng = el('g', {}, svg);
  ui.nodes = {};
  for (const n of G.nodes) {
    const b = box[n.id], g = el('g', { class: 'node' }, ng), x0 = b.x0 + ox;
    const u = { n, g };
    u.clk = el('rect', { x: x0 - 4, y: b.y0 - 4, width: b.w + 8, height: b.h + 8, fill: 'none', stroke: CLKC,
                         'stroke-width': 3, display: 'none' }, g);
    u.box = el('rect', { x: x0, y: b.y0, width: b.w, height: b.h, 'stroke-width': 1.5 }, g);
    u.selr = el('rect', { x: x0 - 2, y: b.y0 - 2, width: b.w + 4, height: b.h + 4, fill: 'none', stroke: '#333',
                          'stroke-width': 1.5, 'stroke-dasharray': '4 3', display: 'none' }, g);
    const T = (x, y, s, f, at = {}) => {
      const t = el('text', Object.assign({ x, y, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
                                           style: 'font:' + f }, at), g);
      t.textContent = s; return t;
    };
    if (n.kind === 'reg') {
      u.dstrip = el('rect', { x: x0 + 6, y: b.y0 + 5, width: b.w - 12, height: 17, stroke: COL.reg[1], 'stroke-width': 0.8 }, g);
      u.dl = T(x0 + 14, b.y0 + 14, 'D', 'bold 12px Arial');
      u.dv = T(b.x + ox + 4, b.y0 + 14, '', 'bold 11px Consolas, monospace');
      u.lbl = T(b.x + ox, b.y0 + 34, n.id, F_LBL);
      u.q = el('rect', { x: x0 + 6, y: b.y0 + 44, width: b.w - 12, height: 22, stroke: COL.reg[1], 'stroke-width': 0.8 }, g);
      u.v = T(b.x + ox, b.y0 + 55.5, '', 'bold 12px Consolas, monospace');
      el('polygon', { points: `${x0},${b.y1 - 16} ${x0 + 9},${b.y1 - 10} ${x0},${b.y1 - 4}`, fill: '#fff', stroke: COL.reg[1] }, g);
    } else {
      u.lbl = T(b.x + ox, b.y0 + 15, n.id, F_LBL);
      u.v = T(b.x + ox, b.y0 + 32, '', F_VAL);
    }
    const tip = el('title', {}, g);
    u.tip = tip;
    dragable(g, n.id);
    ui.nodes[n.id] = u;
  }
}

function setZoom(z) {
  zoom = Math.max(0.2, Math.min(4, z));
  if (GEO) { svg.setAttribute('width', GEO.width * zoom); svg.setAttribute('height', GEO.height * zoom); }
}
function fit() { setZoom((document.getElementById('view').clientWidth - 8) / GEO.width); }

// ------------------------------------------------------------------ cycle state
let cur = { c: 0, s: 1 }, timer = null, anim = null;
const changes = (id, c) => c > 0 && c < NC && val(id, c) !== val(id, c - 1);
const nextChanges = (id, c) => c + 1 < NC && val(id, c + 1) !== val(id, c);

function update(animate) {
  const { c, s } = cur;
  for (const id in ui.nodes) {
    const u = ui.nodes[id], n = u.n, h = val(id, c), on = lit(id, c);
    if (n.kind === 'reg') {
      u.box.setAttribute('fill', '#fbe9e9'); u.box.setAttribute('stroke', COL.reg[1]);
      u.lbl.setAttribute('fill', INK);
      u.q.setAttribute('fill', on ? COL.reg[0] : '#fff');
      u.v.textContent = fmt(h, n.width); u.v.setAttribute('fill', on ? INK : OFF);
      u.clk.setAttribute('display', s === 0 && changes(id, c) ? '' : 'none');
      const dn = s === 2 && nextChanges(id, c);
      u.dstrip.setAttribute('fill', dn ? '#ffe6cc' : '#fff');
      u.dl.setAttribute('fill', dn ? '#d79b00' : '#c98a8a');
      u.dv.textContent = dn ? fmt(val(id, c + 1), n.width) : '';
    } else {
      const lit = on && s > 0;
      const [f, st] = lit ? COL[n.kind] : IDLE;
      u.box.setAttribute('fill', f); u.box.setAttribute('stroke', st);
      u.lbl.setAttribute('fill', lit ? INK : OFF);
      u.v.textContent = fmt(h, n.width); u.v.setAttribute('fill', lit ? INK : OFF);
    }
    u.selr.setAttribute('display', sel === id ? '' : 'none');
    u.tip.textContent = `${id}  [${n.kind}, ${n.width} bit${n.width > 1 ? 's' : ''}]\n${full(h, n.width)}`;
  }
  for (const r of ui.edges) {
    const e = r.e;
    const show = e.back ? s === 2 && nextChanges(e.d, c) : s >= 1 && lit(e.s, c);
    r.hi.setAttribute('display', show ? '' : 'none');
    if (e.back) r.hi.setAttribute('stroke-width', lit(e.s, c) ? r.w : 1.5);
    r.hdots.forEach(d => d.setAttribute('display', show ? '' : 'none'));
    const hl = sel && (e.s === sel || e.d === sel);
    r.base.setAttribute('stroke', hl ? '#333' : WIRE);
    r.base.setAttribute('marker-end', hl ? 'url(#as)' : 'url(#aw)');
    r.bdots.forEach(d => d.setAttribute('fill', hl ? '#333' : WIRE));
  }
  if (anim) cancelAnimationFrame(anim);
  ui.front.setAttribute('height', GEO.height);
  for (const r of ui.edges) if (r.e.back) { r.hi.removeAttribute('stroke-dasharray'); r.hi.removeAttribute('stroke-dashoffset'); }
  if (animate && s === 1) {
    const t0 = performance.now();
    const tick = t => {
      const k = Math.min(1, (t - t0) / 900);
      ui.front.setAttribute('height', GEO.height * k);
      if (k < 1) anim = requestAnimationFrame(tick);
    };
    ui.front.setAttribute('height', 0);
    anim = requestAnimationFrame(tick);
  } else if (animate && s === 2) {
    const tl = ui.edges.filter(r => r.e.back && r.hi.getAttribute('display') !== 'none');
    tl.forEach(r => { const len = r.hi.getTotalLength(); r.len = len; r.hi.setAttribute('stroke-dasharray', len); r.hi.setAttribute('stroke-dashoffset', len); });
    const t0 = performance.now();
    const tick = t => {
      const k = Math.min(1, (t - t0) / 700);
      tl.forEach(r => r.hi.setAttribute('stroke-dashoffset', r.len * (1 - k)));
      if (k < 1) anim = requestAnimationFrame(tick);
      else tl.forEach(r => { r.hi.removeAttribute('stroke-dasharray'); r.hi.removeAttribute('stroke-dashoffset'); });
    };
    anim = requestAnimationFrame(tick);
  }
  notes(); info(); bar();
}

function vlist(ids, c) {
  return ids.map(id => `<li><a data-id="${id}">${id}</a> = <span class="mono">${full(val(id, c), NODE[id].width)}</span></li>`).join('');
}
function notes() {
  const { c, s } = cur, el = document.getElementById('notes');
  if (!NC) { el.innerHTML = '<h3>No simulation data</h3><p class="muted">Run rtlflow with --vcd or --trace to step through cycles.</p>'; return; }
  const vis = G.nodes.map(n => n.id), regs = vis.filter(id => NODE[id].kind === 'reg');
  let h = `<h3>Cycle ${D.cycles[c].label}${D.cycles[c].t != null ? ' <span class="muted">(edge at ' + D.cycles[c].t + ')</span>' : ''}</h3>`;
  if (s === 0) {
    const ch = regs.filter(id => changes(id, c));
    h += '<b>1 clock edge</b>: the registers load their D values.';
    h += c === 0 ? '<p class="muted">First cycle of the trace.</p>'
      : ch.length ? '<ul>' + ch.map(id => `<li><a data-id="${id}">${id}</a>: <span class="mono">${fmt(val(id, c - 1), NODE[id].width)} &rarr; ${fmt(val(id, c), NODE[id].width)}</span></li>`).join('') + '</ul>'
      : '<p class="muted">No register changes value.</p>';
  } else if (s === 1) {
    const ai = vis.filter(id => NODE[id].kind === 'input' && lit(id, c));
    const ao = vis.filter(id => NODE[id].kind === 'output' && lit(id, c));
    const ac = vis.filter(id => NODE[id].kind === 'comb' && lit(id, c));
    h += '<b>2 signals</b>: the active signals (' + { nz: 'non-zero', bit: '1-bit, non-zero', chg: 'changed since the last cycle' }[LIT] + '), from the inputs and the register outputs down to the outputs.';
    h += '<p><b>Inputs</b>' + (ai.length ? '<ul>' + vlist(ai, c) + '</ul>' : ' <span class="muted">none active</span>') + '</p>';
    h += '<p><b>Outputs</b>' + (ao.length ? '<ul>' + vlist(ao, c) + '</ul>' : ' <span class="muted">none active</span>') + '</p>';
    h += `<p class="muted">${ac.length} of ${vis.filter(id => NODE[id].kind === 'comb').length} logic blocks active.</p>`;
  } else {
    const ch = regs.filter(id => nextChanges(id, c));
    h += '<b>3 next state</b>: the values on the registers\' D inputs, loaded at the next edge.';
    h += c + 1 >= NC ? '<p class="muted">Last cycle of the trace.</p>'
      : ch.length ? '<ul>' + ch.map(id => `<li><a data-id="${id}">${id}</a> &rarr; <span class="mono">${fmt(val(id, c + 1), NODE[id].width)}</span><br><span class="muted">from ${G.fin[id].map(f => `<a data-id="${f}">${f}</a>`).join(', ')}</span></li>`).join('') + '</ul>'
      : '<p class="muted">No register changes at the next edge.</p>';
  }
  el.innerHTML = h;
}
function info() {
  const el = document.getElementById('info');
  if (!sel || !NODE[sel]) { el.innerHTML = '<span class="muted">No block selected.</span>'; return; }
  const n = NODE[sel], c = cur.c;
  const lk = ids => ids.length ? ids.map(f => `<a data-id="${f}">${f}</a>`).join(', ') : '<span class="muted">-</span>';
  let h = `<h3>${n.id}</h3><span class="muted">${n.kind}, ${n.width} bit${n.width > 1 ? 's' : ''}${n.src ? '<br>' + n.src.split('|')[0].replace(/^.*[\\/]/, '') : ''}</span>`;
  h += `<p>value: <span class="mono">${full(val(sel, c), n.width)}</span>`;
  if (n.kind === 'reg' && c + 1 < NC) h += `<br>next: <span class="mono">${full(val(sel, c + 1), n.width)}</span>`;
  h += `</p><p>from: ${lk(G.fin[sel] || [])}<br>to: ${lk(G.fout[sel] || [])}</p>`;
  h += `<button id="hidebtn">Hide this block</button>`;
  el.innerHTML = h;
  document.getElementById('hidebtn').onclick = () => { hidden.add(sel); sel = null; relayout(); };
}
document.getElementById('side').addEventListener('click', e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (id) { sel = id; update(false); }
});

// ------------------------------------------------------------------ editing
function dragable(g, id) {
  let st = null;
  g.addEventListener('pointerdown', ev => {
    st = { x: ev.clientX, y: ev.clientY, moved: false };
    g.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  g.addEventListener('pointermove', ev => {
    if (!st) return;
    const dx = (ev.clientX - st.x) / zoom, dy = (ev.clientY - st.y) / zoom;
    if (Math.abs(dx) + Math.abs(dy) > 3) st.moved = true;
    if (st.moved) { g.setAttribute('transform', `translate(${dx},${dy})`); g.classList.add('drag'); }
    st.dx = dx; st.dy = dy;
  });
  g.addEventListener('pointerup', () => {
    if (!st) return;
    const s = st; st = null;
    if (!s.moved) { sel = sel === id ? null : id; update(false); return; }
    const b = GEO.box[id], cy = b.y + s.dy;
    let row = 0, best = Infinity;
    for (let r = 0; r < GEO.R; r++) {
      const d = Math.abs(GEO.rTop[r] + GEO.rowH[r] / 2 - cy);
      if (d < best) { best = d; row = r; }
    }
    const old = L.pos[id].row;
    L.pos[id] = { row, x: b.x + s.dx };
    resolveRow(row);
    if (old !== row) resolveRow(old);
    relayout(true);
  });
}

function relayout(keep) {
  buildGraph();
  for (const n of G.nodes) if (!L.pos[n.id] || L.pos[n.id].row >= L.rows.length) {
    if (!place(n.id)) { autoLayout(); break; }
  }
  if (!keep) for (let r = 0; r < L.rows.length; r++) resolveRow(r);
  normalize();
  route(); render(); update(false); hidSel(); store();
}

function layoutJSON() {
  const pos = {};
  for (const id in L.pos) pos[id] = [L.pos[id].row, Math.round(L.pos[id].x)];
  return { rtlflow_layout: 1, module: D.module, rows: L.rows, hidden: [...hidden], pos };
}
function applyLayout(j) {
  hidden = new Set((j.hidden || []).filter(id => NODE[id]));
  buildGraph();
  L = { rows: j.rows.slice(), pos: {} };
  for (const id in j.pos) if (NODE[id] && j.pos[id][0] < L.rows.length) L.pos[id] = { row: j.pos[id][0], x: j.pos[id][1] };
}
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const KEY = 'rtlflow:' + D.module + ':' + hash(JSON.stringify([D.nodes.map(n => n.id + ':' + n.fanin.join(',')), D.layout]));
function store() { try { localStorage.setItem(KEY, JSON.stringify(layoutJSON())); } catch (e) { /* file:// in some browsers */ } }

function hidSel() {
  const s = document.getElementById('hid');
  const ids = [...hidden].sort();
  s.innerHTML = `<option value="">hidden (${ids.length})</option>` + ids.map(id => `<option value="${id}">show ${id}</option>`).join('');
}
document.getElementById('lit').onchange = e => { LIT = e.target.value; try { localStorage.setItem('rtlflow:lit', LIT); } catch (x) { /* */ } update(false); };
document.getElementById('hid').onchange = e => {
  const id = e.target.value;
  if (id) { hidden.delete(id); sel = id; relayout(); }
};
document.getElementById('auto').onclick = () => { buildGraph(); autoLayout(); route(); render(); update(false); store(); fit(); };
document.getElementById('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(layoutJSON(), null, 1)], { type: 'application/json' }));
  a.download = D.module + '.layout.json'; a.click();
};
document.getElementById('load').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(t => { applyLayout(JSON.parse(t)); relayout(true); fit(); });
};

// ------------------------------------------------------------------ navigation
const NSTEP = Math.max(1, NC * 3);
const $ = id => document.getElementById(id);
$('slider').max = NSTEP - 1;
function bar() {
  const { c, s } = cur;
  $('slider').value = c * 3 + s;
  $('pos').textContent = NC ? `cycle ${D.cycles[c].label}  (${c + 1}/${NC})` : '';
  $('steps').innerHTML = NC ? STEP_NAMES.map((n, j) => `<span class="${j === s ? 'on' : ''}" data-j="${j}">${j + 1} ${n}</span>`).join('') : '';
  if (NC) history.replaceState(null, '', '#' + c + '.' + s);
}
function go(k, animate = true) {
  k = Math.max(0, Math.min(NSTEP - 1, k));
  cur = { c: Math.floor(k / 3), s: k % 3 };
  update(animate);
}
const here = () => cur.c * 3 + cur.s;
function play() {
  if (timer) { clearInterval(timer); timer = null; $('play').textContent = 'Play'; return; }
  $('play').textContent = 'Pause';
  timer = setInterval(() => { if (here() >= NSTEP - 1) play(); else go(here() + 1); }, 1300);
}
$('first').onclick = () => go(0);
$('prev').onclick = () => go(here() - 1);
$('next').onclick = () => go(here() + 1);
$('pcyc').onclick = () => go(cur.s ? cur.c * 3 : (cur.c - 1) * 3);
$('ncyc').onclick = () => go((cur.c + 1) * 3);
$('play').onclick = play;
$('slider').oninput = e => go(+e.target.value, false);
$('steps').onclick = e => { const j = e.target.dataset.j; if (j !== undefined) go(cur.c * 3 + +j); };
$('zin').onclick = () => setZoom(zoom * 1.25);
$('zout').onclick = () => setZoom(zoom / 1.25);
$('zfit').onclick = fit;
document.onkeydown = e => {
  if (/INPUT|SELECT/.test(document.activeElement.tagName) && e.key !== ' ') { if (e.target.type !== 'range') return; }
  const k = { ArrowLeft: () => go(here() - 1), ArrowRight: () => go(here() + 1),
              ArrowUp: () => $('pcyc').onclick(), PageUp: () => $('pcyc').onclick(),
              ArrowDown: () => $('ncyc').onclick(), PageDown: () => $('ncyc').onclick(),
              Home: () => go(0), End: () => go(NSTEP - 1), ' ': play }[e.key];
  if (k) { e.preventDefault(); k(); }
};

// ------------------------------------------------------------------ start
$('title').textContent = D.title;
$('sub').textContent = `module ${D.module} (${D.files.join(', ')})` + (D.source ? `, ${NC} cycles from ${D.source}` : '') +
  '. Thick lavender: active signals (see the lit: menu). Teal: next-state values into the registers\' D inputs.';
document.title = D.title + ' - rtlflow';
try { LIT = localStorage.getItem('rtlflow:lit') || 'nz'; } catch (e) { /* */ }
$('lit').value = LIT;
let saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* none */ }
if (saved || D.layout) { applyLayout(saved || D.layout); relayout(true); }
else { buildGraph(); autoLayout(); route(); render(); hidSel(); }
fit();
const m = /^#(\d+)\.(\d)$/.exec(location.hash);
go(m ? +m[1] * 3 + +m[2] : (NC > 1 ? 4 : 1), false);
</script></body></html>
